[project]
name = "ai-local-daemon"
version = "0.1.0"
description = ""
authors = [
    {name = "katharsis23",email = "daniklv2006@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
packages = [{include = "ai_local_daemon", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.10,<0.16.0)",
    "invoke (>=3.0.3,<4.0.0)",
    "logger (>=1.4,<2.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

# Config for ruff
[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "F401",
    "E501",
]

exclude = [
    "__pycache__",
    "venv",
    ".venv",
    ".ruff_cache",
    ".ruff_cache/*",
    ".pytest_cache",
    ".pytest_cache/*"
]
